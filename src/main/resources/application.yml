server:
  port: 8080

spring:
  application:
    name: bank-rest

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_cards
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml
    enabled: true

# Custom JWT properties (not bound by Spring Boot metadata)
security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000

# Ключ шифрования номеров карт (AES-128: 16 байт, IV: 16 байт)
encryption:
  secret: ${ENCRYPTION_SECRET:9b3d1f4a7c8e5f2d6a0b3c4d5e6f7a8b}
  iv: ${ENCRYPTION_IV:0f8a2b6c4e9d1a3f}

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

logging:
  level:
    com.example.bankcards: DEBUG
    org.springframework.security: DEBUG